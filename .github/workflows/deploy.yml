name: Deploy Website to Hostinger via SSH

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Sync to Hostinger
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Sync Files to Hostinger via Rsync
        run: |
          rsync -avz \
            -e "ssh -i ~/.ssh/deploy_key -p ${{ secrets.SSH_PORT }} -o StrictHostKeyChecking=no" \
            --exclude '.git*' \
            --exclude '.env*' \
            --exclude 'scratch/' \
            --exclude '.DS_Store' \
            --exclude 'README.md' \
            ./ ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:domains/oceanuscontainer.com/public_html/
